name: Publish Python packages

# Pushing a tag such as v0.1.0a1 publishes cambotix-ocr and cambotix-ocr-api
# to PyPI through trusted publishing (no API token is stored anywhere).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release gate
        run: python scripts/check_release.py
      - name: Tag matches both package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in packages/core-python/src/khmerocr/_version.py packages/api/src/khmerocr_api/_version.py; do
            grep -qx "__version__ = \"$version\"" "$file" || { echo "$file is not $version"; exit 1; }
          done
      - run: pip install build twine
      - run: |
          python -m build packages/core-python --outdir dist
          python -m build packages/api --outdir dist
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cambotix-ocr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
