name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests (unit, API, security, schema compatibility)
        run: uv run pytest

  training-pipeline:
    # Fast checks of the recognizer training code (no real training run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/core-python[onnx]" pytest fonttools
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python training/fetch_fonts.py
      - run: pytest training/tests -p no:cacheprovider

  core-without-api:
    # The engine must install and work without the API package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "packages/core-python[validation]" pytest hypothesis
      - run: python -c "import khmerocr, sys; assert 'fastapi' not in sys.modules"
      - run: pytest packages/core-python/tests -p no:cacheprovider

  python-dist:
    # What PyPI would receive: metadata, README rendering, license files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: |
          python -m build packages/core-python --outdir dist
          python -m build packages/api --outdir dist
      - run: twine check --strict dist/*
      - name: Wheels carry the license
        run: |
          for wheel in dist/*.whl; do
            unzip -l "$wheel" | grep -q "licenses/LICENSE" || { echo "no LICENSE in $wheel"; exit 1; }
          done

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --dry-run
      # The package supports Node 18; the test runner itself needs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Built package loads on Node 18 (CJS and ESM)
        run: |
          node -e "const m = require('./dist/cjs/index.js'); if (!m.KhmerOCRClient) process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/esm/index.js'); if (!m.KhmerOCRClient) process.exit(1)"

  sdk-dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  flutter-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-flutter/example/flutter_scanner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  tesseract-offline:
    # Real Tesseract inference inside the Docker image with networking disabled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/core-python[tesseract,onnx]"
      - name: Fetch pinned model files (build time only)
        run: |
          mkdir -p /tmp/tessdata
          for lang in khm eng; do
            curl -sSfL -o /tmp/tessdata/$lang.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/$lang.traineddata
          done
          curl -sSfL -o /tmp/rec.onnx \
            https://github.com/seanghay/KhmerOCR/raw/68c2c72/khmerocr/rec.onnx
      - name: Build bundles
        run: |
          python scripts/build_bundle.py --model-id khmerocr-id-dev \
            --traineddata /tmp/tessdata/khm.traineddata /tmp/tessdata/eng.traineddata \
            --source-url https://github.com/tesseract-ocr/tessdata_fast/tree/4.1.0 \
            --out /tmp/bundle
          python scripts/build_bundle.py --model-id khmerocr-id-hybrid \
            --traineddata /tmp/tessdata/khm.traineddata /tmp/tessdata/eng.traineddata \
            --source-url https://github.com/tesseract-ocr/tessdata_fast/tree/4.1.0 \
            --khmer-onnx /tmp/rec.onnx \
            --khmer-onnx-source-url https://github.com/seanghay/KhmerOCR/tree/68c2c72 \
            --out /tmp/bundle-hybrid
      - run: python benchmarks/generate_synthetic.py --out /tmp/synthetic --count 30
      - run: docker build -f docker/Dockerfile -t khmerocr-api:ci .
      - name: Egress check (system-call level, hybrid engine)
        run: |
          sudo apt-get update && sudo apt-get install -y strace tesseract-ocr
          scripts/check_egress.sh python benchmarks/evaluate.py \
            --dataset /tmp/synthetic --model /tmp/bundle-hybrid --out /tmp/reports-egress
      - name: Benchmark with networking disabled
        run: |
          docker run --rm --network none \
            -v /tmp/bundle:/models/khmerocr-id-dev:ro \
            -v /tmp/synthetic:/data/synthetic:ro \
            -v $PWD/benchmarks:/bench:ro \
            khmerocr-api:ci python /bench/evaluate.py \
              --dataset /data/synthetic --model khmerocr-id-dev --out /tmp/reports

  release-gate:
    # Runs on tags only: blocks releases until models are benchmarked and licenses approved.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
