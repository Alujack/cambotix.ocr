name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real ID card images or anyone's personal data** (names, ID numbers, birth dates), not even cropped or blurred. Reproduce with a synthetic SPECIMEN card (`khmerocr.testing.render_card`) or describe the card in words. Security or privacy problems: use [private reporting](https://github.com/Alujack/cambotix.ocr/security/advisories/new) instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real ID images and no real personal data.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python engine (cambotix-ocr)
        - REST API (cambotix-ocr-api)
        - TypeScript client (@khmerocr/client)
        - Dart/Flutter client (khmerocr)
        - Training pipeline
        - Model bundle
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Package version(s), model bundle ID and version, OS, Python/Node/Dart version.
      placeholder: cambotix-ocr 0.1.0a1, khmerocr-id-v1 0.1.0, Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include error codes and request IDs; remove any document content from logs.
    validations:
      required: true
