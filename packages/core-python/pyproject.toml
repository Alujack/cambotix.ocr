[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "khmerocr"
dynamic = ["version"]
description = "Local-first Khmer/English OCR SDK with Cambodian National ID field extraction."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
validation = ["jsonschema>=4.22"]

[project.scripts]
khmerocr = "khmerocr.adapters.cli:main"

[tool.hatch.version]
path = "src/khmerocr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khmerocr"]
